[project]
name = "exam-api"
version = "0.1.0"
description = "Exam backend Python Worker (FastAPI + D1)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
local = [
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy>=2.0.31,<3",
    "alembic>=1.13.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.4,<3",
    "pydantic-settings>=2.3.4",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.3",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "pytest>=8.2",
]
